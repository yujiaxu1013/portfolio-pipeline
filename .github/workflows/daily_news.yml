name: Daily news fetch and tag

on:
  schedule:
    - cron: '40 7 * * 1-5'
  workflow_dispatch:

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install feedparser psycopg2-binary google-genai python-dotenv requests

      - name: Run fetch_news
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python fetch_news.py

      - name: Run tag_news
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tag_news.py